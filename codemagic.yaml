workflows:
  ios-release:
    name: TacPadel iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.TacPadel.app
      vars:
        XCODE_PROJECT: "artifacts/padel-trainer/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
    scripts:
      - name: Install pnpm and Build Web App
        script: |
          rm -f /Users/builder/package.json
          export COREPACK_ENABLE_STRICT=0
          npm install -g pnpm --force
          pnpm install --force
          pnpm add -D -w @rollup/rollup-darwin-arm64@4.62.0 lightningcss-darwin-arm64@1.32.0 @tailwindcss/oxide-darwin-arm64@4.3.1
          cd artifacts/padel-trainer
          pnpm run build
      - name: Sync Capacitor for iOS
        script: |
          cd artifacts/padel-trainer
          pnpm exec cap sync ios
      - name: Set up Apple code signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          cd artifacts/padel-trainer/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true