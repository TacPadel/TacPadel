workflows:
  ios-release:
    name: TacPadel iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.TacPadel.app
      vars:
        XCODE_PROJECT: "artifacts/padel-trainer/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          corepack enable
          pnpm install
          cd artifacts/padel-trainer
          pnpm run build
          pnpm exec cap sync ios
      - name: Set up Apple code signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          cd artifacts/padel-trainer/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA for App Store and TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true