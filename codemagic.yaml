workflows:
  ios-release:
    name: TacPadel iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        XCODE_PROJECT: "artifacts/padel-trainer/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
    scripts:
      - name: Install pnpm globally and Build Web App
        script: |
          # Corepack umgehen und pnpm direkt über npm installieren
          npm install -g pnpm
          
          # Im Hauptverzeichnis die Workspace-Abhängigkeiten installieren
          pnpm install
          
          # Web-App im Unterordner bauen
          cd artifacts/padel-trainer
          pnpm run build
      - name: Sync Capacitor for iOS
        script: |
          npm install -g pnpm
          cd artifacts/padel-trainer
          pnpm exec cap sync ios
      - name: Increment build number
        script: |
          cd artifacts/padel-trainer/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --allowProvisioningUpdates
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true