workflows:
  ios-release:
    name: TacPadel iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        XCODE_PROJECT: "artifacts/padel-trainer/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
    scripts:
      - name: Install pnpm and Build Web App
        script: |
          # Störende Yarn-Vorgabe auf dem Cloud-Mac löschen und pnpm erzwingen
          rm -f /Users/builder/package.json
          export COREPACK_ENABLE_STRICT=0
          npm install -g pnpm --force
          
          # Im Hauptverzeichnis alle Workspace-Pakete installieren
          pnpm install
          
          # Fehlende native macOS-M2-Module für Rollup und LightningCSS nachladen
          pnpm add -D -w @rollup/rollup-darwin-arm64@4.62.0 lightningcss-darwin-arm64@1.32.0
          
          # Web-App bauen
          cd artifacts/padel-trainer
          pnpm run build
      - name: Sync Capacitor for iOS
        script: |
          cd artifacts/padel-trainer
          pnpm exec cap sync ios
      - name: Increment build number
        script: |
          cd artifacts/padel-trainer/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-allowProvisioningUpdates"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true