<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TacPadel – App herunterladen</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #151c2c;
      border: 1px solid #263147;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
    p {
      margin: 0 0 28px;
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      margin-bottom: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      box-sizing: border-box;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-ios {
      background: #ffffff;
      color: #0b0f19;
    }
    .btn-android {
      background: #10b981;
      color: #0b0f19;
    }
  </style>
  <script>
    const IOS_URL = "https://apps.apple.com/app/id6829195076";
    const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.TacPadel.app";

    window.addEventListener("DOMContentLoaded", () => {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isAndroid = /android/i.test(ua);

      if (isIOS) {
        window.location.replace(IOS_URL);
      } else if (isAndroid) {
        window.location.replace(ANDROID_URL);
      }
    });
  </script>
</head>
<body>
  <div class="card">
    <h1>TacPadel</h1>
    <p>Wähle dein System, um TacPadel direkt im Store herunterzuladen:</p>
    <a id="ios-link" class="btn btn-ios" href="https://apps.apple.com/app/id6829195076"> Laden im App Store</a>
    <a id="android-link" class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.TacPadel.app">▶ Jetzt bei Google Play</a>
  </div>
</body>
</html>
